name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the manifests
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in package.json .agents/.claude-plugin/plugin.json .agents/.codex-plugin/plugin.json; do
            v=$(node -p "require('./$f').version")
            [ "$v" = "$tag" ] || { echo "$f is $v, tag is $tag"; exit 1; }
          done
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
