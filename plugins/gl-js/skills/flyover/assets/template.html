<!DOCTYPE html>
<html>
<head>
<title>{{title}}</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v{{version}}/mapbox-gl.css">
<script src="https://api.mapbox.com/mapbox-gl-js/v{{version}}/mapbox-gl.js"></script>
<style>
body { margin: 0; background: #000; }
#map { position: absolute; inset: 0; opacity: 0; transition: opacity 300ms; }
#download { position: absolute; top: 12px; right: 12px; }
</style>
</head>

<body>
<div id="map"></div>
<button id="download" hidden>Download video</button>

<!-- assets/flyover.ts with types stripped, so the module below can import it -->
<script type="importmap">{ "imports": { "flyover": "data:text/javascript;base64,{{library}}" } }</script>
<script type="module">
import { compileFlight, groundElevation, configureBasemap, preload, play, record } from "flyover";

const waypoints = {{waypoints}};

const params = new URLSearchParams(location.search);
mapboxgl.accessToken = params.get("access_token") ?? prompt("Mapbox access token");

const map = new mapboxgl.Map({
    container: "map",
    style: params.get("style") ?? "mapbox://styles/mapbox/standard",
    center: waypoints.features[0].geometry.coordinates,
    zoom: 14,
    interactive: false,
    maxPitch: 85,
    preserveDrawingBuffer: true
});

map.on("style.load", () => {
    configureBasemap(map, params);
    map.addSource("dem", { type: "raster-dem", url: "mapbox://mapbox.mapbox-terrain-dem-v1" });
    map.setTerrain({ source: "dem" });
});

map.on("load", async () => {
    const flight = await compileFlight(waypoints, groundElevation(mapboxgl.accessToken));
    await preload(map, flight);

    const player = play(map, flight);
    map.getContainer().style.opacity = 1;

    window.addEventListener("keydown", (e) => {
        if (e.code !== "Space") return;
        e.preventDefault();
        player.toggle();
    });

    const button = document.getElementById("download");
    button.hidden = false;
    button.onclick = async () => {
        button.disabled = true;
        await record(map, player);
        button.disabled = false;
    };
});
</script>
</body>
</html>
